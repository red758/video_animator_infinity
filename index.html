
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEON // INFINITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script>
      window.process = window.process || { env: {} };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
        }
        #root {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Animated Background Orbs */
        .bg-orb {
            position: fixed;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }
        .orb-1 { background: radial-gradient(circle, #4f46e5 0%, transparent 70%); top: -10%; left: -10%; }
        .orb-2 { background: radial-gradient(circle, #818cf8 0%, transparent 70%); bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 10%) scale(1.1); }
        }

        #root:empty {
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #root:empty::before {
            content: "";
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 2px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.7, 0, 0.3, 1) infinite;
        }
        #root:empty::after {
            content: "AEON_CORE_INITIALIZING";
            font-size: 10px;
            letter-spacing: 0.8em;
            color: #ffffff;
            font-weight: 900;
            text-transform: uppercase;
            opacity: 0.5;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "@google/genai": "https://esm.sh/@google/genai@1.41.0",

    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
