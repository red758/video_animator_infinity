<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEON // INFINITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script>
      window.process = window.process || { env: {} };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020205;
            background-image: 
                radial-gradient(circle at 50% 0%, #0f172a 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, #020617 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, #08070b 0%, transparent 40%);
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }
        #root {
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Subtle Cinema Grain */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        /* Ambient Nebula Depth */
        .nebula {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.03) 0%, transparent 40%);
            top: 0;
            left: 0;
            z-index: -1;
            filter: blur(100px);
        }

        #root:empty {
            background: #020205;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        #root:empty::before {
            content: "";
            width: 48px;
            height: 48px;
            border: 2px solid rgba(255, 255, 255, 0.01);
            border-top: 2px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
